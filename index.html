<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Action Hub</title>
<meta name="description" content="A calendar of upcoming actions on AI safety: marches, watch parties and community events.">
<style>
  :root {
    --bg: #fafaf7; --surface: #ffffff; --text: #1a1a1a; --muted: #5f5f5a;
    --border: #e4e3dd; --accent: #c2410c; --accent-soft: #fff1e8; --chip: #f1f0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1c1c1c; --text: #ededed; --muted: #a3a39c;
            --border: #2e2e2c; --accent: #fb923c; --accent-soft: #2a1a10; --chip: #262624; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  h2 { font-size: 1.15rem; margin: 40px 0 14px; }

  /* Month grid */
  .cal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-head strong { font-size: 1.05rem; }
  .cal-head button { background: none; border: 1px solid var(--border); color: var(--text);
                     border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { font-size: .72rem; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; }
  .day { min-height: 64px; border-radius: 8px; padding: 6px; font-size: .85rem; color: var(--muted); }
  .day.blank { visibility: hidden; }
  .day.has { background: var(--accent-soft); color: var(--text); cursor: pointer; outline: 2px solid var(--accent); }
  .day.has .n { font-weight: 700; color: var(--accent); }
  .day .dot { display: block; font-size: .7rem; line-height: 1.25; margin-top: 4px; color: var(--text); }
  .day.today .n { text-decoration: underline; }
  @media (max-width: 560px) { .day { min-height: 44px; } .day .dot { display: none; } }

  /* Event list: iMessage-style link previews */
  .date-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .events-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; margin-top: 12px; }
  @media (max-width: 760px) { .events-grid { grid-template-columns: minmax(0,1fr); } }
  .event { display: flex; flex-direction: column; min-width: 0; }
  .preview { display: block; text-decoration: none; color: inherit; border-radius: 18px; overflow: hidden;
             background: var(--chip); border: 1px solid var(--border); transition: transform .15s, box-shadow .15s; }
  .preview:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.12); }
  .preview img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; }
  .preview .meta { padding: 12px 16px 14px; }
  .preview .meta strong { display: block; font-size: 1rem; line-height: 1.3; }
  .preview .meta span { color: var(--muted); font-size: .85rem; }
  .details { padding: 14px 4px 0; }
  .details p { margin: 0 0 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: .82rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: .9rem;
         border: 1px solid var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-bottom: 12px; }
  td { padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: top; }
  td a { color: var(--accent); margin-right: 8px; display: inline-block; }
  td:nth-child(2) { white-space: nowrap; }
  @media (max-width: 560px) { tr { display: grid; grid-template-columns: 1fr auto; } td:last-child { grid-column: 1 / -1; border-top: 0; padding-top: 0; } }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Action Hub</h1>
    <p>Upcoming public actions on AI: marches, watch parties and community events. Pick one, show up, bring a friend.</p>
  </header>

  <h2>Upcoming actions</h2>
  <div id="events"></div>


  <h2>Calendar</h2>
  <div class="cal">
    <div class="cal-head">
      <button id="prev" aria-label="Previous month">‹</button>
      <strong id="month"></strong>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>


</div>

<script>
// ---- Add events here. Dates are YYYY-MM-DD. ----
const EVENTS = [
  {
    date: "2026-11-14",
    title: "AI Treaty March",
    org: "Stop The AI Race",
    image: "img/aitreatymarch.png",
    previewTitle: "AI Treaty March",
    url: "https://aitreatymarch.org/",
    summary: "Marches calling for an international AI treaty in San Francisco, Washington DC, New York, Montréal, Toronto and Paris.",
    tags: ["March", "6 cities"],
    buttons: [["Find your march","https://aitreatymarch.org/", true]]
  },
  {
    date: "2026-11-14",
    title: "AI Reality Check",
    org: "Humans in Control",
    image: "img/realitycheck.png",
    previewTitle: "AI Reality Check – Saturday, November 14, 2026",
    url: "https://realitycheckhq.org/",
    summary: "Local watch parties across the US on what AI is, its risks, and what we can do about them.",
    tags: ["Watch party", "Nationwide (US)"],
    buttons: [["Find an event","https://realitycheckhq.org/find", true],["Host one","https://realitycheckhq.org/apply", false]]
  }
];

const pad = n => String(n).padStart(2, "0");
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const byDate = EVENTS.reduce((acc, e) => ((acc[e.date] ||= []).push(e), acc), {});
const today = new Date();
const todayKey = key(today.getFullYear(), today.getMonth(), today.getDate());

// Start on the month of the next upcoming event (or this month).
const upcoming = EVENTS.map(e => e.date).filter(d => d >= todayKey).sort();
let [vy, vm] = (upcoming[0] || todayKey).split("-").map(Number); vm -= 1;

function renderCal() {
  const grid = document.getElementById("grid");
  document.getElementById("month").textContent =
    new Date(vy, vm, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  let html = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  const first = new Date(vy, vm, 1).getDay();
  const days = new Date(vy, vm + 1, 0).getDate();
  for (let i = 0; i < first; i++) html += `<div class="day blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const k = key(vy, vm, d), evs = byDate[k] || [];
    const cls = ["day", evs.length && "has", k === todayKey && "today"].filter(Boolean).join(" ");
    html += `<div class="${cls}" ${evs.length ? `data-k="${k}"` : ""}><span class="n">${d}</span>` +
      evs.map(e => `<span class="dot">${e.title}</span>`).join("") + `</div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll(".has").forEach(el =>
    el.onclick = () => document.getElementById("d-" + el.dataset.k)?.scrollIntoView({ behavior: "smooth" }));
}
document.getElementById("prev").onclick = () => { if (--vm < 0) { vm = 11; vy--; } renderCal(); };
document.getElementById("next").onclick = () => { if (++vm > 11) { vm = 0; vy++; } renderCal(); };

function renderEvents() {
  const dates = Object.keys(byDate).filter(d => d >= todayKey).sort();
  document.getElementById("events").innerHTML = dates.length ? dates.map(d => {
    const label = new Date(d + "T12:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    return `<section id="d-${d}"><div class="date-label">${label}</div><div class="events-grid">` + byDate[d].map(e => `
      <article class="event">
        <a class="preview" href="${e.url}">
          <img src="${e.image}" alt="${e.title} preview" width="1200" height="630" loading="lazy">
          <div class="meta"><strong>${e.previewTitle || e.title}</strong><span>${new URL(e.url).hostname}</span></div>
        </a>
        <div class="details">
          <p>${e.summary}</p>
          <div class="chips">${(e.tags || []).map(t => `<span class="chip">${t}</span>`).join("")}</div>
          ${e.cities ? `<table>${e.cities.map(c => `<tr><td><strong>${c.name}</strong></td><td>${c.time}</td>
            <td>${c.links.map(([n, u]) => `<a href="${u}">${n}</a>`).join("")}</td></tr>`).join("")}</table>` : ""}
          <div class="actions">${e.buttons.map(([n, u, p]) => `<a class="btn${p ? " primary" : ""}" href="${u}">${n}</a>`).join("")}</div>
        </div>
      </article>`).join("") + `</div></section>`;
  }).join("") : `<p>No upcoming events yet.</p>`;
}

renderCal();
renderEvents();
</script>
</body>
</html>
